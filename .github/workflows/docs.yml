name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.tfplugindocs.yml'

jobs:
  validate-docs:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tfproviderdocs
        run: go install github.com/YakDriver/tfproviderdocs@latest

      - name: Build provider
        run: go build -o terraform-provider-openwrt .

      - name: Validate documentation
        run: |
          tfproviderdocs check \
            --provider-name openwrt \
            --provider-source registry.terraform.io/bucksbunni/openwrt